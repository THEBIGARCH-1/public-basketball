<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Room Code Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0d0e15; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #chat-container { width: 90vw; max-width: 800px; height: 85vh; background: #1a1d2e; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #3b4252; }
        #chat-header { padding: 16px 20px; background: #141625; border-bottom: 1px solid #2e3440; display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 12px; padding: 6px 12px; border-radius: 12px; background: #bf616a; color: #fff; font-weight: bold; }
        .status.online { background: #a3be8c; color: #1a1d2e; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #2e3440; padding: 10px 14px; border-radius: 8px; max-width: 75%; width: fit-content; word-break: break-word; }
        .msg.self { align-self: flex-end; background: #5e81ac; }
        .msg .sender { font-size: 11px; color: #d8dee9; margin-bottom: 3px; display: block; font-weight: bold; }
        #input-area { padding: 15px; background: #141625; display: flex; gap: 10px; border-top: 1px solid #2e3440; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #3b4252; background: #2e3440; color: #fff; outline: none; }
        button { padding: 12px 20px; background: #88c0d0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #1a1d2e; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 10; }
        .modal { background: #1a1d2e; padding: 30px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; text-align: center; width: 320px; border: 1px solid #3b4252; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="modal">
            <h2>Enter Live Chat</h2>
            <p style="font-size: 12px; color: #88c0d0;">Enter a name & match room codes to talk!</p>
            <input type="text" id="username" placeholder="Your Name" maxlength="15">
            <input type="text" id="roomcode" placeholder="Room Code (e.g. ROOM99)" maxlength="15">
            <button onclick="startChat()">Connect to Room</button>
        </div>
    </div>

    <div id="chat-container">
        <div id="chat-header">
            <span id="room-display" style="font-weight: bold;">Room: ----</span>
            <span id="status-badge" class="status">Disconnected</span>
        </div>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="message-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">Send</button>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let myName = "User";
        let roomID = "";

        // PeerJS Configuration with Google STUN Servers to bypass network firewalls
        const peerConfig = {
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ]
            }
        };

        function startChat() {
            myName = document.getElementById('username').value.trim() || "User";
            const code = document.getElementById('roomcode').value.trim().toUpperCase();
            if (!code) return;

            roomID = "ROOM_" + code;
            document.getElementById('room-display').innerText = "Room: " + code;
            document.getElementById('overlay').style.display = 'none';

            addSystemMsg("Connecting to Peer Server...");

            // Try joining as Host using Room Code
            peer = new Peer(roomID, peerConfig);

            peer.on('open', () => {
                addSystemMsg(`Created room [${code}]. Tell your friend to enter the exact same code!`);
            });

            // If the code is already hosted by Person 1, join them as a Client
            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    peer = new Peer(peerConfig); 
                    peer.on('open', () => {
                        conn = peer.connect(roomID, { reliable: true });
                        setupClientHandlers();
                    });
                } else {
                    addSystemMsg("Error connecting: " + err.type);
                }
            });

            // Host receives connection from Friend
            peer.on('connection', (c) => {
                conn = c;
                setupConnectionHandlers();
            });
        }

        function setupClientHandlers() {
            conn.on('open', () => {
                setOnline();
                addSystemMsg("Connected live to your friend!");
            });
            conn.on('data', data => addMsg(data.sender, data.text, false));
            conn.on('close', () => setOffline());
        }

        function setupConnectionHandlers() {
            conn.on('open', () => {
                setOnline();
                addSystemMsg("Your friend joined the room!");
            });
            conn.on('data', data => addMsg(data.sender, data.text, false));
            conn.on('close', () => setOffline());
        }

        function send() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            addMsg(myName, text, true);

            if (conn && conn.open) {
                conn.send({ sender: myName, text: text });
            } else {
                addSystemMsg("Message not sent. Waiting for your friend to enter the code...");
            }

            input.value = "";
        }

        function setOnline() {
            const badge = document.getElementById('status-badge');
            badge.innerText = "Connected Live!";
            badge.classList.add('online');
        }

        function setOffline() {
            const badge = document.getElementById('status-badge');
            badge.innerText = "Partner Disconnected";
            badge.classList.remove('online');
            addSystemMsg("Connection lost.");
        }

        function addMsg(sender, text, isSelf) {
            const box = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `msg ${isSelf ? 'self' : ''}`;
            div.innerHTML = `<span class="sender">${sender}</span>${escape(text)}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function addSystemMsg(text) {
            const box = document.getElementById('messages');
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.fontSize = '12px';
            div.style.color = '#88c0d0';
            div.style.margin = '4px 0';
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function escape(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
