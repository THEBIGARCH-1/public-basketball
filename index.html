v<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 1v1 Basketball - PC & Mobile Modes</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>

    <div id="game-container">
        <div id="mode-select-bar">
            <button id="btn-mode-pc" class="mode-btn active">PC / Keyboard Mode</button>
            <button id="btn-mode-mobile" class="mode-btn">Mobile / Touch Mode</button>
        </div>

        <div id="crosshair"></div>

        <div id="scoreboard">
            <div class="score-box"><span class="team-label">PLAYER</span><span id="player-score">0</span></div>
            <div class="vs">VS</div>
            <div class="score-box"><span id="cpu-score">0</span><span class="team-label">CPU</span></div>
        </div>

        <div id="shot-meter-container">
            <div id="shot-meter-bar"></div>
            <div id="shot-sweet-spot"></div>
        </div>

        <div id="touch-controls" class="hidden">
            <div id="joystick-zone">
                <div id="joystick-base">
                    <div id="joystick-stick"></div>
                </div>
            </div>
            <div id="action-zone">
                <button id="sprint-btn" class="skill-btn">SPRINT</button>
                <button id="dribble-btn" class="skill-btn">DRIBBLE</button>
                <button id="dunk-btn" class="skill-btn">DUNK</button>
                <button id="shoot-btn">SHOOT</button>
            </div>
        </div>

        <div id="controls-hint">
            <span id="hint-text">PC Mode: Click screen to lock mouse. WASD = Move | SHIFT = Sprint | E = Dribble | Q = Dunk | Left-Click = Shoot</span>
        </div>

        <div id="pause-menu">
            PAUSED<br>
            <span style="font-size:18px; font-family:Arial;">Press P or Tap Screen to Resume</span>
        </div>
    </div>

</body>
</html>
