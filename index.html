<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 1v1 Basketball - Mobile & Touch</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>

    <div id="game-container">
        <div id="crosshair"></div>

        <div id="scoreboard">
            <div class="score-box"><span class="team-label">PLAYER</span><span id="player-score">0</span></div>
            <div class="vs">VS</div>
            <div class="score-box"><span id="cpu-score">0</span><span class="team-label">CPU</span></div>
        </div>

        <div id="shot-meter-container">
            <div id="shot-meter-bar"></div>
            <div id="shot-sweet-spot"></div>
        </div>

        <div id="touch-controls">
            <div id="joystick-zone">
                <div id="joystick-base">
                    <div id="joystick-stick"></div>
                </div>
            </div>

            <div id="action-zone">
                <button id="shoot-btn">SHOOT</button>
            </div>
        </div>

        <div id="controls-hint">
            Use <b>Virtual Joystick</b> to Move | Drag <b>Right Side</b> to Aim | Tap/Hold <b>SHOOT</b>
        </div>

        <div id="pause-menu">
            PAUSED<br>
            <span style="font-size:18px; font-family:Arial;">Tap screen to Resume</span>
        </div>
    </div>

</body>
</html>
