<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 1v1 Basketball - Third Person</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="scoreboard-ui">
            <div class="score-box">PLAYER: <span id="player-score">0</span></div>
            <div class="timer-box">3D HOOPS</div>
            <div class="score-box">OPPONENT: <span id="opp-score">0</span></div>
        </div>

        <div id="crosshair"></div>

        <div id="power-bar-container">
            <div id="power-bar"></div>
        </div>

        <div id="controls-hint">
            <b>Controls:</b> WASD to Move | Move Mouse to Aim | Click to Shoot (Harder from deep!)
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
