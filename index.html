<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Retro Full Court Basketball</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: 'Impact', 'Courier New', Courier, monospace;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        canvas {
            background-color: #1a0f07;
            border: 4px solid #ff9800;
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.4);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }

        #scoreboard {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 25px;
            background: #111;
            padding: 8px 24px;
            border: 3px solid #ffcc00;
            border-radius: 6px;
            box-shadow: 0 0 10px #ffcc00;
            z-index: 10;
        }

        .score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-digits {
            font-size: 32px;
            color: #ffcc00;
            text-shadow: 0 0 8px #ff9800;
            letter-spacing: 2px;
        }

        .team-label {
            font-size: 11px;
            color: #aaa;
            letter-spacing: 1px;
        }

        .vs-badge {
            font-size: 18px;
            color: #ff3333;
            text-shadow: 0 0 5px #ff0000;
        }

        #touch-controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        #joystick-zone {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 120px;
            height: 120px;
            pointer-events: auto;
        }

        #joystick-base {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 204, 0, 0.6);
            border-radius: 50%;
        }

        #joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 46px;
            height: 46px;
            margin-top: -23px;
            margin-left: -23px;
            background: #ffcc00;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffcc00;
        }

        #action-zone {
            position: absolute;
            bottom: 25px;
            right: 25px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            pointer-events: auto;
        }

        .arcade-btn {
            background: #222;
            border: 3px solid #fff;
            color: #fff;
            font-size: 13px;
            border-radius: 10px;
            box-shadow: 0 5px 0 #000;
            cursor: pointer;
            text-shadow: 1px 1px 0 #000;
        }

        .arcade-btn:active, .arcade-btn.active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #000;
        }

        #shoot-btn {
            width: 75px;
            height: 75px;
            border-color: #ff3333;
            color: #ffcc00;
            font-size: 16px;
            background: radial-gradient(circle, #cc0000, #660000);
        }

        .skill-btn {
            width: 58px;
            height: 58px;
        }

        #sprint-btn { border-color: #00cc44; background: radial-gradient(circle, #008822, #004411); }
        #dribble-btn { border-color: #3399ff; background: radial-gradient(circle, #0055cc, #002266); }
        #dunk-btn { border-color: #cc33ff; background: radial-gradient(circle, #8800cc, #440066); }

        #controls-hint {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-family: sans-serif;
            font-size: 11px;
            z-index: 5;
            white-space: nowrap;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="scoreboard">
            <div class="score-box">
                <span class="team-label">HOME</span>
                <span id="player-score" class="score-digits">00</span>
            </div>
            <div class="vs-badge">VS</div>
            <div class="score-box">
                <span class="team-label">AWAY</span>
                <span id="cpu-score" class="score-digits">00</span>
            </div>
        </div>

        <div id="touch-controls">
            <div id="joystick-zone">
                <div id="joystick-base">
                    <div id="joystick-stick"></div>
                </div>
            </div>
            
            <div id="action-zone">
                <button id="sprint-btn" class="arcade-btn skill-btn">SPRINT</button>
                <button id="dribble-btn" class="arcade-btn skill-btn">TRICK</button>
                <button id="dunk-btn" class="arcade-btn skill-btn">DUNK</button>
                <button id="shoot-btn" class="arcade-btn">SHOOT</button>
            </div>
        </div>

        <div id="controls-hint">
            <b>PC CONTROLS:</b> WASD / Arrows = Move | <b>SHIFT</b> = Sprint | <b>SPACE / CLICK</b> = Hold & Release Shoot | <b>Q</b> = Dunk | <b>E</b> = Trick
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            const V_WIDTH = 768;
            const V_HEIGHT = 432;

            function resize() {
                const winW = window.innerWidth;
                const winH = window.innerHeight;
                const winRatio = winW / winH;
                const gameRatio = V_WIDTH / V_HEIGHT;

                if (winRatio > gameRatio) {
                    canvas.style.width = (winH * gameRatio) + 'px';
                    canvas.style.height = winH + 'px';
                } else {
                    canvas.style.width = winW + 'px';
                    canvas.style.height = (winW / gameRatio) + 'px';
                }
                
                canvas.width = V_WIDTH;
                canvas.height = V_HEIGHT;
            }
            window.addEventListener('resize', resize);
            resize();

            const COURT_TOP = 140;
            const COURT_BOTTOM = 410;
            const COURT_LEFT = 40;
            const COURT_RIGHT = V_WIDTH - 40;

            const gravity = 0.35;

            let playerScore = 0;
            let cpuScore = 0;

            let keys = {};
            let touchMoveDir = { x: 0, y: 0 };
            let isSprinting = false;

            let ballPossession = 'player'; // 'player', 'cpu', or 'none'
            let isShooting = false;
            let shotPower = 0;
            let shotPowerDir = 1;
            let hasScoredThisShot = false;

            let isDunking = false;
            let dunkProgress = 0;
            let dunkStartPos = { x: 0, y: 0 };
            let dunkTargetHoop = null;

            let isTrickDribbling = false;
            let trickTime = 0;

            let animTime = 0;

            const leftHoop = { x: COURT_LEFT + 25, y: 220, rimY: 170, scoreX: COURT_LEFT + 25 };
            const rightHoop = { x: COURT_RIGHT - 25, y: 220, rimY: 170, scoreX: COURT_RIGHT - 25 };

            // Input Listeners
            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (e.code === 'KeyE') performTrickDribble();
                if (e.code === 'KeyQ') performDunk();
                if (e.code === 'Space' && !e.repeat && ballPossession === 'player') triggerShotStart();
            });
            window.addEventListener('keyup', (e) => {
                keys[e.code] = false;
                if (e.code === 'Space' && isShooting) triggerShotRelease();
            });

            canvas.addEventListener('mousedown', (e) => {
                if (e.button === 0 && ballPossession === 'player') triggerShotStart();
            });
            canvas.addEventListener('mouseup', (e) => {
                if (e.button === 0 && isShooting) triggerShotRelease();
            });

            // Touch Joystick
            const joyStick = document.getElementById('joystick-stick');
            const joyZone = document.getElementById('joystick-zone');
            let joyCenter = { x: 0, y: 0 };
            let joyTouchId = null;

            joyZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                joyTouchId = touch.identifier;
                const rect = joyZone.getBoundingClientRect();
                joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                updateJoystickStick(touch.clientX, touch.clientY);
            });

            joyZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joyTouchId) updateJoystickStick(touch.clientX, touch.clientY);
                }
            });

            function updateJoystickStick(clientX, clientY) {
                const maxRadius = 40;
                const dx = clientX - joyCenter.x;
                const dy = clientY - joyCenter.y;
                const dist = Math.hypot(dx, dy);
                const clampedDist = Math.min(dist, maxRadius);
                const angle = Math.atan2(dy, dx);
                
                joyStick.style.transform = `translate(${Math.cos(angle)*clampedDist}px, ${Math.sin(angle)*clampedDist}px)`;
                touchMoveDir.x = Math.cos(angle) * (clampedDist / maxRadius);
                touchMoveDir.y = Math.sin(angle) * (clampedDist / maxRadius);
            }

            function resetJoystick() {
                joyTouchId = null;
                touchMoveDir = { x: 0, y: 0 };
                joyStick.style.transform = 'translate(0px, 0px)';
            }
            joyZone.addEventListener('touchend', resetJoystick);
            joyZone.addEventListener('touchcancel', resetJoystick);

            const shootBtn = document.getElementById('shoot-btn');
            const sprintBtn = document.getElementById('sprint-btn');
            const dribbleBtn = document.getElementById('dribble-btn');
            const dunkBtn = document.getElementById('dunk-btn');

            shootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if(ballPossession === 'player') triggerShotStart(); });
            shootBtn.addEventListener('touchend', (e) => { e.preventDefault(); if(isShooting) triggerShotRelease(); });

            sprintBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isSprinting = true; sprintBtn.classList.add('active'); });
            sprintBtn.addEventListener('touchend', (e) => { e.preventDefault(); isSprinting = false; sprintBtn.classList.remove('active'); });

            dribbleBtn.addEventListener('touchstart', (e) => { e.preventDefault(); performTrickDribble(); });
            dunkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); performDunk(); });

            function triggerShotStart() { 
                if(!isDunking && !isTrickDribbling && ballPossession === 'player'){ 
                    isShooting = true; 
                    shotPower = 0; 
                    shotPowerDir = 1; 
                }
            }

            function triggerShotRelease() { 
                if (isShooting) {
                    isShooting = false; 
                    releaseShot(); 
                }
            }

            function performTrickDribble() { 
                if(ballPossession === 'player' && !isShooting && !isDunking) { 
                    isTrickDribbling = true; 
                    trickTime = 0; 
                }
            }

            function performDunk() { 
                if(ballPossession === 'player' && !isShooting && !isTrickDribbling){
                    const distToRight = Math.hypot(player.x - rightHoop.x, player.y - rightHoop.y);
                    const distToLeft = Math.hypot(player.x - leftHoop.x, player.y - leftHoop.y);
                    
                    if(distToRight < 140) {
                        dunkTargetHoop = rightHoop;
                        startDunkAction();
                    } else if (distToLeft < 140) {
                        dunkTargetHoop = leftHoop;
                        startDunkAction();
                    }
                }
            }

            function startDunkAction() {
                isDunking = true;
                dunkProgress = 0;
                dunkStartPos = { x: player.x, y: player.y };
            }

            class Entity {
                constructor(x, y, radius, color, name) {
                    this.x = x; this.y = y; this.radius = radius; this.color = color; this.name = name;
                    this.vx = 0; this.vy = 0; this.vz = 0; this.z = 0;
                    this.facingLeft = false;
                }
                
                draw() {
                    ctx.fillStyle = 'rgba(0,0,0,0.45)';
                    ctx.beginPath();
                    ctx.ellipse(this.x, this.y, this.radius, this.radius * 0.45, 0, 0, Math.PI * 2);
                    ctx.fill();

                    const drawY = this.y - this.z;

                    ctx.fillStyle = this.color;
                    ctx.fillRect(this.x - 8, drawY - 22, 16, 14);
                    ctx.fillStyle = '#111';
                    ctx.fillRect(this.x - 8, drawY - 8, 16, 8);
                    ctx.fillStyle = '#e0ac69';
                    ctx.fillRect(this.x - 6, drawY, 4, 8);
                    ctx.fillRect(this.x + 2, drawY, 4, 8);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(this.x - 7, drawY + 6, 5, 3);
                    ctx.fillRect(this.x + 2, drawY + 6, 5, 3);
                    ctx.fillStyle = '#e0ac69';
                    ctx.fillRect(this.x - 6, drawY - 32, 12, 10);
                    ctx.fillStyle = '#222';
                    ctx.fillRect(this.x - 6, drawY - 34, 12, 3);
                }
            }

            const player = new Entity(V_WIDTH * 0.35, (COURT_TOP + COURT_BOTTOM)/2, 12, '#1e88e5', 'Player');
            const cpu = new Entity(V_WIDTH * 0.65, (COURT_TOP + COURT_BOTTOM)/2, 12, '#d32f2f', 'CPU');
            const ball = new Entity(player.x, player.y, 6, '#ff6600', 'Ball');

            function constrain(entity) {
                if (entity.x < COURT_LEFT + entity.radius) entity.x = COURT_LEFT + entity.radius;
                if (entity.x > COURT_RIGHT - entity.radius) entity.x = COURT_RIGHT - entity.radius;
                if (entity.y < COURT_TOP + entity.radius) entity.y = COURT_TOP + entity.radius;
                if (entity.y > COURT_BOTTOM - entity.radius) entity.y = COURT_BOTTOM - entity.radius;
            }

            function handlePlayerCollision() {
                const dx = cpu.x - player.x;
                const dy = cpu.y - player.y;
                const dist = Math.hypot(dx, dy);
                const minDist = player.radius + cpu.radius;

                if (dist < minDist && dist > 0) {
                    const overlap = minDist - dist;
                    const nx = dx / dist;
                    const ny = dy / dist;

                    player.x -= nx * (overlap / 2);
                    player.y -= ny * (overlap / 2);
                    cpu.x += nx * (overlap / 2);
                    cpu.y += ny * (overlap / 2);
                }
            }

            function releaseShot() {
                ballPossession = 'none';
                hasScoredThisShot = false;

                const targetHoop = (player.x > V_WIDTH / 2) ? rightHoop : leftHoop;
                
                // Perfect spot is between 70% and 85%
                const accuracyFactor = 1 - Math.abs(shotPower - 75) / 75;
                const drift = (1 - accuracyFactor) * 35;

                const targetX = targetHoop.scoreX + (Math.random() - 0.5) * drift;
                const targetY = targetHoop.rimY;

                const flightTime = 42;
                ball.x = player.x;
                ball.y = player.y;
                ball.z = 20;

                const deltaX = targetX - player.x;
                const deltaY = targetY - player.y;

                ball.vx = deltaX / flightTime;
                ball.vy = deltaY / flightTime;
                ball.vz = Math.max(6, 7.5 + (Math.abs(deltaX) / 45));
            }

            function update() {
                animTime++;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                drawStadiumAndCourt();

                const sprintActive = keys['ShiftLeft'] || keys['ShiftRight'] || isSprinting;
                let speed = sprintActive ? 5.2 : 3.0;

                if (isDunking) {
                    dunkProgress += 0.035;
                    player.x = dunkStartPos.x + (dunkTargetHoop.x - dunkStartPos.x) * dunkProgress;
                    player.y = dunkStartPos.y + (dunkTargetHoop.y - dunkStartPos.y) * dunkProgress;
                    player.z = Math.sin(dunkProgress * Math.PI) * 48;

                    ball.x = player.x + (dunkTargetHoop.x > player.x ? 8 : -8);
                    ball.y = player.y - player.z - 10;

                    if (dunkProgress >= 0.78 && !hasScoredThisShot) {
                        playerScore += 2;
                        hasScoredThisShot = true;
                        
                        ballPossession = 'none';
                        ball.x = dunkTargetHoop.scoreX;
                        ball.y = dunkTargetHoop.rimY;
                        ball.z = 20;
                        ball.vx = 0; ball.vy = 2; ball.vz = -8;
                    }

                    if (dunkProgress >= 1.0) {
                        isDunking = false;
                        player.z = 0;
                    }

                } else {
                    let vx = 0, vy = 0;
                    if (keys['KeyA'] || keys['ArrowLeft']) vx -= 1;
                    if (keys['KeyD'] || keys['ArrowRight']) vx += 1;
                    if (keys['KeyW'] || keys['ArrowUp']) vy -= 1;
                    if (keys['KeyS'] || keys['ArrowDown']) vy += 1;

                    if (touchMoveDir.x !== 0 || touchMoveDir.y !== 0) {
                        vx = touchMoveDir.x;
                        vy = touchMoveDir.y;
                    }

                    const len = Math.hypot(vx, vy);
                    if (len > 0) {
                        player.vx = (vx / len) * speed;
                        player.vy = (vy / len) * speed;
                        player.facingLeft = player.vx < 0;
                    } else {
                        player.vx *= 0.7; player.vy *= 0.7;
                    }

                    player.x += player.vx;
                    player.y += player.vy;
                    constrain(player);
                }

                if (isShooting) {
                    shotPower += shotPowerDir * 1.2;
                    if (shotPower >= 100) { shotPower = 100; shotPowerDir = -1; }
                    if (shotPower <= 0) { shotPower = 0; shotPowerDir = 1; }
                }

                if (isTrickDribbling) {
                    trickTime++;
                    if (trickTime > 35) isTrickDribbling = false;
                }

                // CPU AI Movement
                const cpuTargetX = ballPossession === 'player' ? player.x + 32 : ball.x;
                const cpuTargetY = ballPossession === 'player' ? player.y : ball.y;
                cpu.x += (cpuTargetX - cpu.x) * 0.03;
                cpu.y += (cpuTargetY - cpu.y) * 0.03;
                constrain(cpu);

                handlePlayerCollision();

                // Ball Mechanics
                if (ballPossession === 'player') {
                    const side = player.facingLeft ? -12 : 12;
                    const dribbleFreq = isTrickDribbling ? 0.5 : 0.25;
                    ball.x = player.x + side;
                    ball.y = player.y;
                    ball.z = Math.abs(Math.sin(animTime * dribbleFreq)) * 14;

                } else if (ballPossession === 'cpu') {
                    ball.x = cpu.x + 10;
                    ball.y = cpu.y;
                    ball.z = Math.abs(Math.sin(animTime * 0.25)) * 14;

                } else if (ballPossession === 'none' && !isDunking) {
                    ball.vz -= gravity;
                    ball.x += ball.vx;
                    ball.y += ball.vy;
                    ball.z += ball.vz;

                    if (ball.z <= 0) {
                        ball.z = 0;
                        ball.vz = -ball.vz * 0.6;
                        ball.vx *= 0.85;
                        ball.vy *= 0.85;
                    }

                    [leftHoop, rightHoop].forEach(hoop => {
                        const distToHoop = Math.hypot(ball.x - hoop.scoreX, ball.y - hoop.rimY);
                        if (!hasScoredThisShot && distToHoop < 18 && ball.vz < 0 && ball.z < 30) {
                            hasScoredThisShot = true;
                            playerScore += 2;
                        }
                    });

                    if (ball.z < 15) {
                        if (Math.hypot(player.x - ball.x, player.y - ball.y) < 22) {
                            ballPossession = 'player';
                        } else if (Math.hypot(cpu.x - ball.x, cpu.y - ball.y) < 22) {
                            ballPossession = 'cpu';
                        }
                    }
                }

                cpu.draw();
                player.draw();
                drawBall();

                drawForegroundHoops();
                drawUI();

                document.getElementById('player-score').textContent = playerScore.toString().padStart(2, '0');
                document.getElementById('cpu-score').textContent = cpuScore.toString().padStart(2, '0');

                requestAnimationFrame(update);
            }

            function drawStadiumAndCourt() {
                ctx.fillStyle = '#0f0a1c';
                ctx.fillRect(0, 0, V_WIDTH, COURT_TOP);

                for (let row = 0; row < 4; row++) {
                    const rowY = 30 + row * 22;
                    ctx.fillStyle = (row % 2 === 0) ? '#1c1533' : '#261c42';
                    ctx.fillRect(0, rowY, V_WIDTH, 18);

                    for (let x = 10; x < V_WIDTH; x += 14) {
                        const headColor = ((x + row * 7) % 3 === 0) ? '#ffcc99' : (((x + row) % 2 === 0) ? '#cc6633' : '#8d5524');
                        const shirtColor = ((x * 3 + row) % 5 === 0) ? '#ff3333' : (((x + row * 3) % 2 === 0) ? '#3399ff' : '#00cc66');
                        ctx.fillStyle = shirtColor;
                        ctx.fillRect(x, rowY + 6, 8, 10);
                        ctx.fillStyle = headColor;
                        ctx.fillRect(x + 1, rowY + 1, 6, 6);
                    }
                }

                ctx.fillStyle = '#c67d34';
                ctx.fillRect(COURT_LEFT, COURT_TOP, COURT_RIGHT - COURT_LEFT, COURT_BOTTOM - COURT_TOP);

                ctx.fillStyle = 'rgba(0,0,0,0.04)';
                for (let y = COURT_TOP; y < COURT_BOTTOM; y += 12) {
                    ctx.fillRect(COURT_LEFT, y, COURT_RIGHT - COURT_LEFT, 6);
                }

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;

                ctx.strokeRect(COURT_LEFT, COURT_TOP, COURT_RIGHT - COURT_LEFT, COURT_BOTTOM - COURT_TOP);

                const midX = (COURT_LEFT + COURT_RIGHT) / 2;
                ctx.beginPath();
                ctx.moveTo(midX, COURT_TOP);
                ctx.lineTo(midX, COURT_BOTTOM);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(midX, (COURT_TOP + COURT_BOTTOM) / 2, 45, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#a14d18';
                const keyHeight = 110;
                const keyY = (COURT_TOP + COURT_BOTTOM) / 2 - keyHeight / 2;
                
                ctx.fillRect(COURT_LEFT, keyY, 100, keyHeight);
                ctx.strokeRect(COURT_LEFT, keyY, 100, keyHeight);

                ctx.fillRect(COURT_RIGHT - 100, keyY, 100, keyHeight);
                ctx.strokeRect(COURT_RIGHT - 100, keyY, 100, keyHeight);
            }

            function drawForegroundHoops() {
                [leftHoop, rightHoop].forEach((hoop, i) => {
                    const isLeft = i === 0;
                    const poleX = isLeft ? hoop.x - 18 : hoop.x + 18;

                    ctx.fillStyle = '#333';
                    ctx.fillRect(poleX - 4, hoop.rimY, 8, hoop.y - hoop.rimY + 40);

                    ctx.fillStyle = '#fff';
                    ctx.strokeStyle = '#cc0000';
                    ctx.lineWidth = 3;
                    const boardX = isLeft ? hoop.x - 12 : hoop.x + 4;
                    ctx.fillRect(boardX, hoop.rimY - 35, 8, 45);
                    ctx.strokeRect(boardX, hoop.rimY - 35, 8, 45);

                    ctx.strokeStyle = '#ff3300';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(hoop.x - 12, hoop.rimY, 24, 4);

                    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(hoop.x - 10, hoop.rimY + 4);
                    ctx.lineTo(hoop.x - 6, hoop.rimY + 20);
                    ctx.lineTo(hoop.x + 6, hoop.rimY + 20);
                    ctx.lineTo(hoop.x + 10, hoop.rimY + 4);
                    ctx.stroke();
                });
            }

            function drawBall() {
                const drawY = ball.y - ball.z;

                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                ctx.ellipse(ball.x, ball.y, ball.radius * (1 - ball.z / 150), ball.radius * 0.4 * (1 - ball.z / 150), 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = ball.color;
                ctx.beginPath();
                ctx.arc(ball.x, drawY, ball.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(ball.x, drawY, ball.radius, 0, Math.PI);
                ctx.stroke();
            }

            function drawUI() {
                if (isShooting) {
                    const barW = 60;
                    const barH = 10;
                    const barX = player.x - barW / 2;
                    const barY = player.y - player.z - 48;

                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);

                    ctx.fillStyle = `hsl(${shotPower * 1.2}, 100%, 50%)`;
                    ctx.fillRect(barX, barY, barW * (shotPower / 100), barH);

                    ctx.fillStyle = '#00ff66';
                    ctx.fillRect(barX + barW * 0.70, barY, barW * 0.12, barH);

                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(barX, barY, barW, barH);
                }
            }

            update();
        });
    </script>
</body>
</html>
